[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "DFIR-CONQR"
version = "0.1.0"
description = "Open-source cross-platform GUI/CLI tool for digital forensic triage and incident response collection"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Your Name", email = "you@example.com" }
]
keywords = ["dfir", "forensics", "incident-response", "triage", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "psutil>=5.9",
    "PySide6>=6.6",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "pyinstaller>=6.6"]

[project.scripts]
conqr-cli = "dfir_conqr.cli:main"
conqr-gui = "dfir_conqr.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
